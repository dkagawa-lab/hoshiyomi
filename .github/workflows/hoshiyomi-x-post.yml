name: HOSHIYOMI X auto post

on:
  workflow_dispatch:        # 手動実行も可能(テスト用)
    inputs:
      dry_run:
        description: "1なら投稿せず文面のみ生成"
        default: "1"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/x-auto-post/requirements.txt

      - name: Generate and post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://hoshiyomi4u.com/m
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python scripts/x-auto-post/generate_and_post.py
